<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Actra 与 Obsidian 的连接流程</title>
  <desc id="desc">在 ACTRA App 了解步骤，在 Obsidian 安装并启用 Actra 插件，在浏览器登录 ACTRA 并授权，最后返回 Obsidian 同步。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .heading { fill: #142532; font-size: 24px; font-weight: 700; }
      .body { fill: #526371; font-size: 17px; }
      .label { fill: #267c83; font-size: 16px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#8a9da9" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#f4f7f8"/>
  <text x="44" y="51" fill="#163645" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="21" font-weight="700">连接在哪一步完成？</text>
  <g>
    <rect x="40" y="83" width="251" height="170" rx="18" fill="#ffffff" stroke="#e4ebee"/>
    <circle cx="72" cy="115" r="18" fill="#d9f0ed"/><text x="66" y="122" class="label">1</text>
    <text x="60" y="162" class="heading">ACTRA App</text>
    <text x="60" y="196" class="body">查看 Obsidian 连接指引</text>
    <text x="60" y="224" class="body">可以跨设备阅读步骤</text>
    <path d="M300 168 H327" stroke="#8a9da9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="338" y="83" width="251" height="170" rx="18" fill="#ffffff" stroke="#e4ebee"/>
    <circle cx="370" cy="115" r="18" fill="#d9f0ed"/><text x="364" y="122" class="label">2</text>
    <text x="358" y="162" class="heading">Obsidian 插件</text>
    <text x="358" y="196" class="body">安装、启用 Actra</text>
    <text x="358" y="224" class="body">点击“使用 Actra 账号连接”</text>
    <path d="M598 168 H625" stroke="#8a9da9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="636" y="83" width="251" height="170" rx="18" fill="#ffffff" stroke="#e4ebee"/>
    <circle cx="668" cy="115" r="18" fill="#d9f0ed"/><text x="662" y="122" class="label">3</text>
    <text x="656" y="162" class="heading">ACTRA 浏览器页面</text>
    <text x="656" y="196" class="body">登录 ACTRA 账号</text>
    <text x="656" y="224" class="body">确认所需同步权限</text>
    <path d="M896 168 H923" stroke="#8a9da9" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="934" y="83" width="226" height="170" rx="18" fill="#e8f3f4" stroke="#b9dce0"/>
    <circle cx="966" cy="115" r="18" fill="#268b88"/><text x="960" y="122" fill="#ffffff" font-size="16" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">4</text>
    <text x="954" y="162" class="heading">返回 Obsidian</text>
    <text x="954" y="196" class="body">看到“已连接”</text>
    <text x="954" y="224" class="body">开始同步 ACTRA 内容</text>
  </g>
  <text x="43" y="283" fill="#5c6f7b" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="15">连接动作从 Obsidian 插件发起；ACTRA App 本身不直接访问本地 Vault。</text>
</svg>
